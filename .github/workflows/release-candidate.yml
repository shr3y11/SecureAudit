name: Windows release candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Windows software tests
        shell: pwsh
        run: |
          python -m pytest -q -ra --junitxml=test-results.xml 2>&1 | Tee-Object -FilePath test-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Build and verify portable archive
        shell: pwsh
        run: |
          python tools/build_portable.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          python tools/package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Test extracted packaged launcher
        shell: pwsh
        run: |
          $archive = Get-Item dist/SecureAudit-v*-Windows-x64.zip
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'secureaudit-release-check'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $verifyRoot
          $exe = Get-ChildItem -Path $verifyRoot -Filter SecureAuditCentral.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Packaged launcher missing' }
          $env:SECUREAUDIT_SELF_TEST_RESULT = Join-Path $pwd 'packaged-self-test.json'
          $process = Start-Process -FilePath $exe.FullName -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:SECUREAUDIT_SELF_TEST_RESULT) { Get-Content $env:SECUREAUDIT_SELF_TEST_RESULT }
            $env:TCL_LIBRARY = Join-Path $exe.DirectoryName '_tcl_data'
            $env:TK_LIBRARY = Join-Path $exe.DirectoryName '_tk_data'
            & (Join-Path $exe.DirectoryName 'python.exe') -c "import json; from launcher import release_self_test; print(json.dumps(release_self_test(), indent=2))"
            throw 'Packaged launcher failed'
          }
          if (-not (Test-Path $env:SECUREAUDIT_SELF_TEST_RESULT)) { throw 'Missing packaged self-test record' }
          $result = Get-Content $env:SECUREAUDIT_SELF_TEST_RESULT -Raw | ConvertFrom-Json
          if ($result.self_test -ne 'passed') { throw 'Packaged self-test did not pass' }
          $signature = Get-AuthenticodeSignature $exe.FullName
          $signature | Select-Object Status, StatusMessage, SignerCertificate | Format-List | Out-File interpreter-signature.txt
      - name: Assemble release files
        shell: pwsh
        run: |
          $version = python -c "from secureaudit_central import __version__; print(__version__)"
          New-Item -ItemType Directory release-files | Out-Null
          Copy-Item dist/*.zip,dist/*.sha256 release-files/
          git archive --format=zip --prefix="SecureAudit-v$version-source/" --output="release-files/SecureAudit-v$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item README.md,RELEASE_NOTES.md,docs/RELEASE_GUIDE.md,packaged-self-test.json,test-results.xml,test-results.txt,interpreter-signature.txt release-files/
          @(
            "SecureAudit v$version prerelease candidate"
            "Commit: $(git rev-parse HEAD)"
            "Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "Windows software tests: passed (see test-results.txt and test-results.xml)"
            "Extracted portable-launcher self-test: passed"
            "PostgreSQL integration and other platforms: see separate CI jobs"
            "This is build verification, not collector ground-truth accuracy validation."
          ) | Set-Content release-files/BUILD-VERIFICATION.txt
          Get-ChildItem release-files -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release-files/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SecureAudit-v0.6.0-beta-release-files
          path: release-files/*
          retention-days: 30
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source and documentation files
        shell: bash
        run: |
          mkdir release-source
          git archive --format=zip --prefix=SecureAudit-v0.6.0-beta-source/ --output=release-source/SecureAudit-v0.6.0-beta-source.zip HEAD
          cp README.md RELEASE_NOTES.md docs/RELEASE_GUIDE.md release-source/
          cd release-source
          sha256sum SecureAudit-v0.6.0-beta-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SecureAudit-v0.6.0-beta-source-files
          path: release-source/*
          retention-days: 30
          if-no-files-found: error
